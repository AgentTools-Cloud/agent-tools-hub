server {
    server_name hub.agent-tools.cloud;
    client_max_body_size 25m;

    access_log /var/log/nginx/hub.agent-tools.cloud.access.log;
    access_log /var/log/nginx/aop-rollout.log aop_test;
    error_log  /var/log/nginx/hub.agent-tools.cloud.error.log;

    location / {
        proxy_pass http://127.0.0.1:9300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        add_header Access-Control-Expose-Headers "PAYMENT-REQUIRED, PAYMENT-RESPONSE, X-PAYMENT, X-Payment-Tx, payment-required, payment-response" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-PAYMENT, x-payment" always;
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/hub.agent-tools.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.agent-tools.cloud/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_client_certificate /etc/nginx/certs/cloudflare-origin-pull-ca.pem;
    ssl_verify_client on;
    ssl_verify_depth 1;
}

server {
    if ($host = hub.agent-tools.cloud) {
        return 301 https://$host$request_uri;
    }

    server_name hub.agent-tools.cloud;
    listen 80;
    listen [::]:80;
    return 404;
}
